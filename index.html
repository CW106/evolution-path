        '<div class="meta">' + esc(cr.name) + '・從' + (periodOf(x.startPid) || { name: '' }).name + '出發・' + (x.mode === 'future' ? '未來模式' : '經典模式') + '</div>' +
        '<div class="meta"><b style="color:var(--ink)">' + (ENDING[x.ending] || '') + '</b>・撐了 ' + E.fmtSpan(x.span) + '・' + esc(x.cls) + '</div>' +
        '<div class="meta">' + (x.species ? esc(x.species.zh) + ' <i>' + esc(x.species.la) + '</i>' + (x.species.fic ? ficTag(true) : '') : '<i>' + esc(x.sci) + '</i>') + '</div>' +
        '<div class="meta num">' + (d.getMonth() + 1) + '/' + d.getDate() + (x.rank ? '・同時出發排名 ' + x.rank : '') + '</div>' +
        (x.line ? '<q>' + esc(x.line) + '</q>' : '') + '</div></article>';
    }).join('');
    return '<p class="muted" style="margin:0 0 12px">你玩過的每一個物種都會留在這裡，紀錄只存在這個瀏覽器。</p>' +
      '<div class="museum">' + (cards || '<div class="card empty">還沒有任何化石。去演化一個物種吧！</div>') + '</div>' +
      (list.length ? (S.confirmClear ? '<div class="confirm-row" style="margin-top:14px"><span>確定要清除全部紀錄（包括成就和圖鑑）嗎？</span><button class="btn btn-sm" data-act="clear-yes">清除</button><button class="btn btn-sm btn-ghost" data-act="clear-no">取消</button></div>'
        : '<div style="margin-top:14px"><button class="link" data-act="clear">清除全部紀錄</button></div>') : '');
  }
  function achBody(m) {
    var list = ACH.slice().sort(function (x, y) { return (m[y[0]] ? 1 : 0) - (m[x[0]] ? 1 : 0) || ACH.indexOf(x) - ACH.indexOf(y); });
    return '<p class="muted" style="margin:0 0 12px">已解鎖 ' + Object.keys(m).length + ' / ' + ACH.length + ' 個成就。</p><div class="ach-grid">' + list.map(function (a) {
      var got = m[a[0]], d = got ? new Date(got) : null;
      return '<div class="card ach' + (got ? ' got' : '') + '"><span class="ach-ic" aria-hidden="true">' + (got ? '★' : '☆') + '</span><div><b>' + a[1] + '</b><small>' + a[2] + '</small>' +
        (got ? '<small class="num when">' + (d.getMonth() + 1) + '/' + d.getDate() + ' 解鎖</small>' : '') + '</div></div>';
    }).join('') + '</div>';
  }
  function dexBody(dx) {
    return '<p class="muted" style="margin:0 0 12px">你的物種演化成過的生物分類。已收集 ' + Object.keys(dx).length + ' / ' + DEX.length + ' 種。想看每一種生物，請到「物種」分頁。</p><div class="dex-grid">' + DEX.map(function (c) {
      var x = dx[c], art = '';
      if (x) { try { art = A.creatureSVG(x.sp, { pid: x.pid, stage: x.stage, crowd: false }); } catch (e) { art = ''; } }
      return '<figure class="card dex' + (x ? ' got' : '') + '"><div class="mini">' + (x ? art : '<span class="q" aria-hidden="true">？</span>') + '</div>' +
        '<figcaption><b>' + c + '</b><small>' + (x ? '由「' + esc(x.nick) + '」發現' : DEX_HINT[c] || '') + '</small></figcaption></figure>';
    }).join('') + '</div>';
  }
  // 物種圖鑑
  var FIC_PAGE = 48;
  function spCard(art, name, lines, got, badge) {
    return '<figure class="card spc' + (got ? ' got' : '') + '"><div class="mini">' + (art || '<span class="q" aria-hidden="true">？</span>') + (badge || '') + '</div>' +
      '<figcaption><b>' + name + '</b>' + lines.map(function (l) { return '<small>' + l + '</small>'; }).join('') + '</figcaption></figure>';
  }
  function realBody(m) {
    return E.START_ERAS.map(function (e) {
      var p = periodOf(e.pid), got = e.creatures.filter(function (c) { return m.real[c]; }).length;
      // 還沒遇見任何一種的時代先收起來，頁面才不會太長
      return '<details class="sp-era"' + (got ? ' open' : '') + '><summary style="--band:' + p.color + '"><span class="dot" aria-hidden="true"></span>' + p.name + '<span class="num muted">' + got + ' / ' + e.creatures.length + '</span></summary>' +
        '<div class="sp-grid">' + e.creatures.map(function (cid) {
          var c = E.CREATURES[cid], seen = !!m.real[cid], art = '';
          if (seen) { try { art = A.creatureSVG(spOf(cid), { pid: e.pid, stage: 0, crowd: false }); } catch (er) { art = ''; } }
          return spCard(art, c.name, [seen ? '<i>' + c.sci + '</i>' : '還沒遇見'], seen);
        }).join('') + '</div></details>';
    }).join('');
  }
  function ficBody(m) {
    var total = '<p class="muted sp-total">這個遊戲世界一共可能出現 <b class="num">' + E.SPECIES_TOTAL.toLocaleString('en-US') + '</b> 種虛構物種：由 ' + DEX.length + ' 種分類、招牌特徵、體型和顏色組合而成，名字是依照特徵自動取的。</p>';
    var list = Object.keys(m.fic).map(function (k) { return { key: k, x: m.fic[k] || {}, info: E.speciesFromKey(k) }; }).filter(function (o) { return o.info && o.info.zh; });
    if (!list.length) return total + '<div class="card empty">還沒有發現任何虛構物種。' + (S.fiction ? '物種演化到和祖先夠不一樣時，就會出現新的虛構物種。' : '首頁「設定」裡的「虛構物種」目前是關閉的，打開之後才會出現。') + '</div>';
    var counts = {};
    list.forEach(function (o) { counts[o.info.cls] = (counts[o.info.cls] || 0) + 1; });
    var classes = DEX.filter(function (c) { return counts[c]; });
    var cls = S.ficCls && counts[S.ficCls] ? S.ficCls : '';
    var shown = list.filter(function (o) { return !cls || o.info.cls === cls; }).sort(function (a, b) { return (b.x.t || 0) - (a.x.t || 0); });
    var pages = Math.max(1, Math.ceil(shown.length / FIC_PAGE)), pg = Math.min(Math.max(0, S.ficPage || 0), pages - 1);
    var chips = '<div class="fchips" id="fchips" role="group" aria-label="依分類篩選"><button class="fchip' + (cls ? '' : ' on') + '" data-act="ficcls" data-cls="" aria-pressed="' + !cls + '">全部 <span class="num">' + list.length + '</span></button>' +
      classes.map(function (c) { return '<button class="fchip' + (cls === c ? ' on' : '') + '" data-act="ficcls" data-cls="' + c + '" aria-pressed="' + (cls === c) + '">' + c + ' <span class="num">' + counts[c] + '</span></button>'; }).join('') + '</div>';
    var grid = '<div class="sp-grid">' + shown.slice(pg * FIC_PAGE, pg * FIC_PAGE + FIC_PAGE).map(function (o) {
      var art = '';
      if (o.x.sp) { try { art = A.creatureSVG(o.x.sp, { pid: o.x.pid || 'quaternary', stage: o.x.stage || 0, crowd: false }); } catch (er) { art = ''; } }
      return spCard(art, esc(o.info.zh), ['<i>' + esc(o.info.la) + '</i>', o.info.cls + (o.x.by ? '・從「' + esc(o.x.by) + '」演化而來' : '')], true, ficTag(true));
    }).join('') + '</div>';
    var pager = pages > 1 ? '<div class="pager"><button class="btn btn-sm" data-act="ficpage" data-d="-1"' + (pg <= 0 ? ' disabled' : '') + '>‹ 上一頁</button><span class="num muted">' + (pg + 1) + ' / ' + pages + '</span>' +
      '<button class="btn btn-sm" data-act="ficpage" data-d="1"' + (pg >= pages - 1 ? ' disabled' : '') + '>下一頁 ›</button></div>' : '';
    return total + chips + grid + pager;
  }
  function speciesBody() {
    var m = speciesDex(), sc = speciesCount(), tab = S.spTab === 'fic' ? 'fic' : 'real';
    return '<p class="muted" style="margin:0 0 12px">你在遊戲裡遇見過的物種。真實的古生物來自化石紀錄，出發或同時出發都算遇見；虛構物種' + ficTag(true) + '是遊戲依照身體特徵自動產生的，現實中並不存在。</p>' +
      '<div class="seg2" role="tablist" aria-label="物種圖鑑">' +
      '<button role="tab" class="seg2-i' + (tab === 'real' ? ' on' : '') + '" aria-selected="' + (tab === 'real') + '" data-act="sptab" data-tab="real"><span>真實的古生物</span><span class="num">' + sc.real + ' / ' + ALL_REAL.length + '</span></button>' +
      '<button role="tab" class="seg2-i is-fic' + (tab === 'fic' ? ' on' : '') + '" aria-selected="' + (tab === 'fic') + '" data-act="sptab" data-tab="fic"><span>虛構物種</span><span class="num">' + sc.fic.toLocaleString('en-US') + ' / ' + E.SPECIES_TOTAL.toLocaleString('en-US') + '</span></button></div>' +
      (tab === 'fic' ? ficBody(m) : realBody(m));
  }
  function renderMuseum() {
    topbar.hidden = true; actionbar.hidden = true; app.className = 'wrap';
    var list = museum(), am = achMap(), dx = dexMap(), tab = S.museumTab, sc = speciesCount();
    var tabs = [['fossil', '化石', String(list.length)], ['ach', '成就', Object.keys(am).length + '/' + ACH.length], ['dex', '分類', Object.keys(dx).length + '/' + DEX.length], ['species', '物種', String(sc.all)]];
    app.innerHTML = '<button class="link" data-act="home">← 回首頁</button>' +
      '<div class="section-head"><h2>化石館</h2></div>' +
      '<div class="tabs" role="tablist">' + tabs.map(function (t) {
        return '<button role="tab" class="tab' + (tab === t[0] ? ' on' : '') + '" aria-selected="' + (tab === t[0]) + '" data-act="mtab" data-tab="' + t[0] + '">' + t[1] + ' <span class="num">' + t[2] + '</span></button>';
      }).join('') + '</div>' +
      (tab === 'ach' ? achBody(am) : tab === 'dex' ? dexBody(dx) : tab === 'species' ? speciesBody() : fossilBody(list));
  }

  /* ---------- 開始遊戲 ---------- */
  function startGame(pid, cid, mode, nick) {
    clearTimers(); stopLoop(); stopTpTimer();
    var seed = (Math.random() * 2147483647) >>> 0;
    var first = museum().length === 0;
    S.st = E.newGame(pid, cid, seed, { mode: mode || S.mode, nick: nick != null ? nick : S.nick, fiction: S.fiction });
    S.anim = null; S.runId = 'r' + Date.now().toString(36) + Math.floor(Math.random() * 1e4);
    S.epitaph = ''; S.autoPausedTurn = -1; S.auto = false; S.tpView = null; S.reflect = null; S.rivalOpen = -1; S.resumeAfterSheet = false;
    S.feed = []; S.feedSeq = 0; S.endPlayed = false; S.endSkipNow = false; S.runAch = []; S.lastFocus = null; S.justDied = null;
    var st = S.st, p = E.PERIODS[st.pi], cr = E.CREATURES[cid];
    S.lastTick = '';
    var who = st.nick === cr.name ? esc(cr.name) : esc(st.nick) + '（' + cr.name + '）';
    var t0 = E.fmtAgo(st.startTime);
    pushFeed(t0, 'start', '<b>' + p.name + '</b>：' + p.desc + '<span class="fe-sub">' + who + '的故事從這裡開始。' + cr.fact + '</span>', p.name + '：' + st.nick + '的故事開始了');
    if (st.rivals && st.rivals.length) {
      pushFeed(t0, 'rival', '和你同時出發的還有：' + st.rivals.map(function (r) { return '<b>' + esc(r.nick) + '</b>'; }).join('、') + '。牠們也會一起演化，看看誰能撐到最後。', '同時出發：' + st.rivals.map(function (r) { return r.nick; }).join('、'));
    }
    if (first) pushFeed(t0, 'tip', '<b>小提示</b>「族群重心」隨時可以切換；時間走到一半，可能會遇到需要你決定的轉折點。');
    noteDex(true);
    noteReal([cid].concat((st.rivals || []).map(function (r) { return r.sp.base; })));
    S.phase = 'choose'; S.sheet = 'decide';
    show('game');
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('pointerdown', function () {
    if (S.sound && !SND.isOn()) { if (SND.enable(true)) soundScene(); }
  }, true);
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'scrim') { if (e.target === t) closeSheet(); return; }
    if (act === 'era') { S.eraPid = t.getAttribute('data-pid'); S.pickCid = null; S.nick = ''; show('pick'); }
    else if (act === 'home') { clearTimers(); stopLoop(); stopTpTimer(); S.auto = false; S.anim = null; S.phase = 'idle'; S.sheet = null; S.confirmClear = false; show('home'); }
    else if (act === 'start') { if (S.pickCid) startGame(S.eraPid, S.pickCid); }
    else if (act === 'roll') startRoll();
    else if (act === 'roll-go') {
      var r = S.roll; if (!r || !r.done) return;
      S.eraPid = r.pid; S.nick = ''; S.roll = null; S.sheet = null;
      startGame(r.pid, r.cid, S.mode, '');
      toast('你投胎成了：' + periodOf(r.pid).name + '的' + E.CREATURES[r.cid].name);
    }
    else if (act === 'help') { S.sheet = 'help'; renderSheet(); }
    else if (act === 'closesheet' || act === 'peek') closeSheet();
    else if (act === 'museum') { S.confirmClear = false; show('museum'); }
    else if (act === 'mtab') { S.museumTab = t.getAttribute('data-tab'); S.confirmClear = false; render(); }
    else if (act === 'sptab') { S.spTab = t.getAttribute('data-tab'); S.ficPage = 0; render(); }
    else if (act === 'ficcls') { S.ficCls = t.getAttribute('data-cls') || ''; S.ficPage = 0; render(); }
    else if (act === 'ficpage') {
      S.ficPage = Math.max(0, (S.ficPage || 0) + parseInt(t.getAttribute('data-d'), 10)); render();
      var fc = document.getElementById('fchips'); if (fc) fc.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' });
    }
    else if (act === 'decide') { if (S.phase === 'choose') { S.sheet = 'decide'; renderSheet(); } }
    else if (act === 'opentp') { if (S.phase === 'tp') { S.sheet = 'tp'; renderSheet(); } }
    else if (act === 'openreflect') { if (S.phase === 'reflect') { S.sheet = 'reflect'; renderSheet(); } }
    else if (act === 'reflect-done') reflectDone();
    else if (act === 'rival') {
      S.rivalOpen = parseInt(t.getAttribute('data-i'), 10);
      if (S.phase === 'run') { pauseToggle(); S.resumeAfterSheet = true; }
      S.sheet = 'rival'; renderSheet(); sfx('click');
    }
    else if (act === 'pause') pauseToggle();
    else if (act === 'slower') setSpeed(-1);
    else if (act === 'faster') setSpeed(1);
    else if (act === 'sound') toggleSound();
    else if (act === 'theme') { setTheme(isDark() ? 'light' : 'dark'); sfx('click'); }
    else if (act === 'toend') { clearTimers(); show('end'); }
    else if (act === 'skipanim') skipEnding();
    else if (act === 'tolog') { var fd = document.getElementById('feed'); if (fd) { fd.scrollTop = 0; fd.closest('.feed').scrollIntoView({ behavior: 'smooth', block: 'start' }); } }
    else if (act === 'again') { var st = S.st; startGame(E.PERIODS[st.startPi].id, st.sp.base, st.mode, st.nick); }
    else if (act === 'future') {
      clearTimers(); S.endPlayed = false; S.endSkipNow = false;
      E.continueToFuture(S.st); S.mode = 'future'; S.phase = 'choose'; S.sheet = 'decide';
      pushFeed('現代', 'start', '<b>進入未來</b>：時間繼續往前走。科幻突變和「統治力」已經解鎖。', '進入未來！');
      show('game');
    }
    else if (act === 'clear') { S.confirmClear = true; render(); }
    else if (act === 'clear-yes') { save(KEY_MUSEUM, []); save(KEY_ACH, {}); save(KEY_DEX, {}); save(KEY_SPECIES, {}); SPX = null; S.confirmClear = false; render(); }
    else if (act === 'clear-no') { S.confirmClear = false; render(); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.name === 'mode') {
      S.mode = t.value === 'future' ? 'future' : 'classic'; save(KEY_MODE, S.mode);
      var y = window.scrollY; renderHome(); window.scrollTo(0, y);
      var el = document.getElementById('mode-' + S.mode); if (el) el.focus();
    } else if (t.id === 'opt-fiction') {
      S.fiction = t.checked; save(KEY_FICTION, S.fiction);
      var y2 = window.scrollY; renderHome(); window.scrollTo(0, y2);
      var f2 = document.getElementById('opt-fiction'); if (f2) f2.focus();
      toast(S.fiction ? '已開啟虛構物種：新物種的名字旁會標上「虛構」。' : '已關閉虛構物種：之後的遊戲只會出現真實的生物名稱。');
      sfx('click');
    } else if (t.name === 'theme') {
      setTheme(t.value);
      var y3 = window.scrollY; renderHome(); window.scrollTo(0, y3);
      var f3 = document.querySelector('input[name="theme"][value="' + S.theme + '"]'); if (f3) f3.focus();
      sfx('click');
    } else if (t.id === 'opt-sound') {
      if (t.checked !== S.sound) toggleSound();
    } else if (t.name === 'crit') {
      S.pickCid = t.value;
      var nk = document.getElementById('nick'); if (nk) nk.placeholder = E.CREATURES[S.pickCid].name;
      placeDetail(true);
      renderActionPick();
      sfx('click');
    } else if (t.name === 'mut') {
      if (S.phase !== 'choose') return;
      var id = t.value === 'skip' ? null : t.value;
      var card = t.closest('.opt'); if (card) card.classList.add('picked');
      later(function () { startTurn(id); }, 260);
    } else if (t.name === 'tp') {
      if (S.phase !== 'tp') return;
      var c2 = t.closest('.opt'); if (c2) c2.classList.add('picked');
      var oid = t.value;
      later(function () { chooseTP(oid, 'user'); }, 220);
    } else if (t.name === 'focus' || t.name === 'focus-s') {
      var st = S.st; if (!st || st.focus === t.value) return;
      st.focus = t.value; S.lastFocus = t.value;
      pushFeed(nowLabel(), 'focus', focusLine(t.value), '重心改成「' + E.FOCI[t.value].name + '」');
      Array.prototype.forEach.call(document.querySelectorAll('.seg-i'), function (l) {
        var on = l.getAttribute('data-f') === t.value, inp = l.querySelector('input');
        l.classList.toggle('on', on); if (inp && on) inp.checked = true;
      });
      renderFocusCard();
      if (!S.anim) { var envEl = document.querySelector('.g-env'); if (envEl) envEl.innerHTML = envBlock(st, view()); }
      sfx('click');
    } else if (t.id === 'auto') {
      S.auto = t.checked;
      if (S.auto && S.phase === 'choose') {
        S.autoPausedTurn = S.st ? S.st.turn : -1;   // 已經在這個抉擇時刻了，就直接幫忙選
        S.sheet = null; renderSheet();
        later(autoNext, 250);
      } else if (S.auto && S.phase === 'tp') {
        chooseTP(E.autoTurning(S.st), 'auto');
      }
      renderControls();
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'nick') { S.nick = e.target.value; renderActionPick(); }
    if (e.target.id === 'epitaph') { S.epitaph = e.target.value; updateEpitaph(); }
  });
  document.addEventListener('toggle', function (e) {
    if (e.target && e.target.id === 'traits') S.traitsOpen = e.target.open;
  }, true);
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (e.key === 'Escape' && S.sheet) { closeSheet(); return; }
    if (e.key === 'Enter' && e.target && e.target.id === 'note') { e.preventDefault(); reflectDone(); return; }
    if (e.key === ' ' && S.screen === 'game' && !S.sheet && tag !== 'INPUT' && tag !== 'BUTTON' && tag !== 'SUMMARY' && tag !== 'LABEL') {
      if (S.phase === 'run' || S.phase === 'paused') { e.preventDefault(); pauseToggle(); }
    }
  });
  var rsT = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rsT);
    rsT = setTimeout(function () { if (S.screen === 'pick') placeDetail(false); }, 150);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && S.phase === 'run') pauseToggle();
    SND.suspend(document.hidden);
  });

  /* ---------- 啟動（頁面更新時保留進度） ---------- */
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) {
    hot.snapshot(function () {
      return { S: { screen: S.screen, mode: S.mode, eraPid: S.eraPid, pickCid: S.pickCid, nick: S.nick, st: S.st, sheet: S.sheet === 'help' || S.sheet === 'roll' || S.sheet === 'rival' ? null : S.sheet,
        runId: S.runId, epitaph: S.epitaph, traitsOpen: S.traitsOpen, speed: S.speed, phase: S.phase, anim: S.anim, feed: S.feed, feedSeq: S.feedSeq, lastTick: S.lastTick,
        endPlayed: S.endPlayed, tpView: S.tpView, tpLeft: S.tpLeft, reflect: S.reflect, runAch: S.runAch, lastFocus: S.lastFocus, museumTab: S.museumTab,
        spTab: S.spTab, ficCls: S.ficCls, ficPage: S.ficPage } };
    });
  }
  function start(data) {
    if (data && data.S) {
      for (var k in data.S) S[k] = data.S[k];
      if (S.st && (!S.st.v || S.st.v < 4)) { S.st = null; S.anim = null; S.screen = S.screen === 'museum' ? 'museum' : 'home'; S.phase = 'idle'; S.sheet = null; }
      S.auto = false;
      if (S.phase === 'run') S.phase = 'paused';
      if (!Array.isArray(S.feed)) S.feed = [];
      if (!Array.isArray(S.runAch)) S.runAch = [];
      if (S.phase === 'tp') { S.sheet = 'tp'; if (!S.tpView && S.st) S.tpView = E.currentTurning(S.st); }
      if (S.phase === 'reflect') S.sheet = S.reflect ? 'reflect' : null;
    }
    render();
    if (S.phase === 'tp' && S.tpView && S.tpView.timed) startTpTimer();
  }
  if (hot && hot.ready) hot.ready(start);
  else start((hot && hot.data) || {});
})();

</script>

</body></html>
