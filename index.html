<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>演化之路</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%A6%95%3C%2Ftext%3E%3C%2Fsvg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="從 13 個時代、121 種真實的古生物裡選一個出發，和同時出發的物種一起演化：挑選突變、面對天敵與轉折點、撐過大滅絕，演化出上萬種標示為「虛構」的新物種，甚至在未來統治地球。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: a single-column field journal pinned under a geologic column — the strata timeline rides on top, the specimen card leads, choices follow. */
:root {
  --bg: #E8ECE6;
  --paper: #F7F8F4;
  --ink: #1B2220;
  --muted: #586460;
  --line: #CAD2CB;
  --chip: #DFE5DF;
  --amber: #A2600C;
  --amber-soft: #F2E2C4;
  --on-amber: #FFFBF3;
  --good: #2B7749;
  --bad: #B03A29;
  --warn: #8F5B00;
  --sci: #6E3FBE;
  --sci-soft: #ECE4FA;
  --focus: #1E6FD9;
  --shadow: 0 1px 0 rgb(27 34 32 / .05), 0 10px 26px -16px rgb(27 34 32 / .35);

  --scene-sea-1: #D3E6E9; --scene-sea-2: #96BFC9; --scene-floor: #BDAA84; --scene-flora: #A2B69F;
  --scene-bubble: rgb(255 255 255 / .8); --scene-sky-1: #E1EBEC; --scene-sky-2: #F2EFE5; --scene-ground: #C8B48F;
  --scene-snow: #EEF3F3; --scene-ice: #DCE8EC; --scene-cloud: rgb(255 255 255 / .85); --scene-vent: #6E6357;
  --scene-smoke: rgb(118 124 130 / .55); --scene-strom: #9A8A6A; --scene-sun: #F4CF83; --scene-dune: #D8B985;
  --scene-crack: #7A5A3A; --rock: #CFC6B5; --rock-line: #B6AA96;

  --font-display: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", "Noto Serif TC", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;

  --r: 14px;
  --r-sm: 9px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --paper: #19201D; --ink: #E4EAE6; --muted: #98A49E; --line: #2C3632; --chip: #242D29;
    --amber: #E6A243; --amber-soft: #3A2C17; --on-amber: #1C1305;
    --good: #5CC08A; --bad: #F07E69; --warn: #E3AE4C; --sci: #B793FF; --sci-soft: #2A2240; --focus: #7DB4FF;
    --shadow: 0 1px 0 rgb(0 0 0 / .3), 0 12px 30px -18px rgb(0 0 0 / .8);
    --scene-sea-1: #143A42; --scene-sea-2: #0A232A; --scene-floor: #4B402F; --scene-flora: #33473B;
    --scene-bubble: rgb(200 230 240 / .4); --scene-sky-1: #19262D; --scene-sky-2: #232A2B; --scene-ground: #4A402F;
    --scene-snow: #8D999C; --scene-ice: #4E6168; --scene-cloud: rgb(220 230 235 / .16); --scene-vent: #5A5047;
    --scene-smoke: rgb(160 165 170 / .32); --scene-strom: #6E6249; --scene-sun: #E2B35C; --scene-dune: #6B5537;
    --scene-crack: #2A2016; --rock: #3A3631; --rock-line: #4E4741;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --paper: #19201D; --ink: #E4EAE6; --muted: #98A49E; --line: #2C3632; --chip: #242D29;
  --amber: #E6A243; --amber-soft: #3A2C17; --on-amber: #1C1305;
  --good: #5CC08A; --bad: #F07E69; --warn: #E3AE4C; --sci: #B793FF; --sci-soft: #2A2240; --focus: #7DB4FF;
  --shadow: 0 1px 0 rgb(0 0 0 / .3), 0 12px 30px -18px rgb(0 0 0 / .8);
  --scene-sea-1: #143A42; --scene-sea-2: #0A232A; --scene-floor: #4B402F; --scene-flora: #33473B;
  --scene-bubble: rgb(200 230 240 / .4); --scene-sky-1: #19262D; --scene-sky-2: #232A2B; --scene-ground: #4A402F;
  --scene-snow: #8D999C; --scene-ice: #4E6168; --scene-cloud: rgb(220 230 235 / .16); --scene-vent: #5A5047;
  --scene-smoke: rgb(160 165 170 / .32); --scene-strom: #6E6249; --scene-sun: #E2B35C; --scene-dune: #6B5537;
  --scene-crack: #2A2016; --rock: #3A3631; --rock-line: #4E4741;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: repeating-linear-gradient(180deg, transparent 0 58px, color-mix(in srgb, var(--line) 28%, transparent) 58px 59px);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 640px; margin: 0 auto; padding-block: 18px 128px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--muted); font-weight: 500; }

/* ---------- buttons, chips ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--paper); font-weight: 600; font-size: 15px; transition: transform .12s, background .2s, border-color .2s;
}
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
.btn-primary:hover { border-color: var(--ink); }
.btn-primary[disabled] { opacity: .55; cursor: not-allowed; }
.btn-ghost { background: transparent; }
.btn-sm { min-height: 36px; padding: 6px 14px; font-size: 14px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.link { background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--chip); font-size: 12.5px; line-height: 1.6; white-space: nowrap; }
.chip-up { color: var(--good); }
.chip-down { color: var(--bad); }
.chip-new { background: color-mix(in srgb, var(--good) 14%, var(--paper)); color: var(--good); }
.chip-lose { background: color-mix(in srgb, var(--bad) 12%, var(--paper)); color: var(--bad); }
.chip-move { background: var(--amber-soft); color: var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- home ---------- */
.hero { padding-block: 12px 6px; display: grid; gap: 10px; }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(40px, 11vw, 64px); line-height: 1.05; letter-spacing: .02em; }
.hero h1 span { color: var(--amber); }
.hook { font-size: 17px; line-height: 1.7; max-width: 32em; margin: 0; }
.hook b { font-family: var(--font-data); font-size: 1.15em; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
.mode { position: relative; display: grid; gap: 2px; text-align: left; padding: 12px 14px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--paper); }
.mode input { position: absolute; opacity: 0; pointer-events: none; }
.mode b { font-size: 15px; }
.mode small { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.mode:has(input:checked) { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.mode:has(input:focus-visible) { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.mode.is-future:has(input:checked) { border-color: var(--sci); box-shadow: inset 0 0 0 1px var(--sci); }
.mode .tag { justify-self: start; font-size: 11px; padding: 0 7px; border-radius: 999px; background: var(--sci-soft); color: var(--sci); font-weight: 600; letter-spacing: .05em; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 0 10px; }
.section-head h2 { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.column { display: grid; border-radius: var(--r); overflow: hidden; border: 1.5px solid var(--line); background: var(--paper); box-shadow: var(--shadow); }
.era {
  display: grid; grid-template-columns: 74px 1fr auto; align-items: stretch; gap: 0; text-align: left;
  border: 0; border-top: 1px solid var(--line); background: transparent; padding: 0; min-height: 72px;
}
.era:first-child { border-top: 0; }
.era:hover { background: color-mix(in srgb, var(--band) 9%, var(--paper)); }
.era-band { background: var(--band); color: var(--band-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: .04em; padding: 6px; text-align: center; line-height: 1.2; }
.era-main { display: grid; gap: 1px; padding: 10px 12px; min-width: 0; }
.era-time { font-size: 12px; color: var(--muted); font-family: var(--font-data); }
.era-hook { font-weight: 600; font-size: 15.5px; }
.era-meta { font-size: 12.5px; color: var(--muted); }
.era-meta .best { color: var(--good); }
.era-go { align-self: center; padding-right: 14px; color: var(--muted); font-size: 22px; }
.home-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

/* ---------- pick ---------- */
.era-head { display: grid; grid-template-columns: 10px 1fr; gap: 14px; margin: 8px 0 14px; }
.era-head .bar { background: var(--band); border-radius: 6px; }
.era-head h2 { font-family: var(--font-display); font-size: 30px; font-weight: 700; }
.era-head p { margin: 4px 0 0; color: var(--muted); }
.crit-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.crit-name { font-family: var(--font-display); font-size: 21px; }
.crit-sci { font-family: var(--font-data); font-size: 12.5px; color: var(--muted); }
.crit-blurb { font-size: 14px; }
.crit-facts { font-size: 12.5px; color: var(--muted); }
.crit-tip { font-size: 13px; background: var(--amber-soft); border-radius: 8px; padding: 6px 9px; }
.crit-tip b { font-weight: 600; margin-right: 6px; }
.diff { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 9px; height: 5px; border-radius: 1px; background: var(--line); }
.pips i.on { background: var(--amber); }
.name-field { display: grid; gap: 6px; margin-top: 16px; }
.name-field label { font-weight: 600; }
.name-field input { min-height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); padding: 8px 14px; font-size: 16px; }

/* ---------- top strata bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 640px; margin: 0 auto; display: grid; gap: 6px; }
.strata { display: flex; gap: 2px; height: 14px; }
.strata span { flex: 1 1 0; border-radius: 2px; background: var(--c); opacity: .9; position: relative; }
.strata span.past { opacity: .32; }
.strata span.fut { background-image: repeating-linear-gradient(135deg, transparent 0 3px, rgb(255 255 255 / .35) 3px 5px); }
.strata span.now { opacity: 1; outline: 2px solid var(--ink); outline-offset: 1px; z-index: 1; }
.strata span.mass::after { content: ""; position: absolute; right: -2px; top: -3px; bottom: -3px; width: 2px; background: var(--bad); border-radius: 1px; }
.topline { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 13px; }
.topline b { font-family: var(--font-display); font-size: 17px; }
.topline .num { color: var(--muted); font-size: 12px; white-space: nowrap; }
.icon-btn { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; min-height: 32px; padding: 2px 12px; font-size: 13px; }

/* ---------- game ---------- */
.game { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "spec" "vitals" "focus" "feed" "rivals" "fc" "env" "traits"; }
.g-spec { grid-area: spec; min-width: 0; } .g-vitals { grid-area: vitals; min-width: 0; } .g-feed { grid-area: feed; min-width: 0; }
.g-focus { grid-area: focus; min-width: 0; } .g-rivals { grid-area: rivals; min-width: 0; }
.g-fc { grid-area: fc; min-width: 0; } .g-env { grid-area: env; min-width: 0; display: grid; gap: 8px; } .g-traits { grid-area: traits; min-width: 0; }
.g-fc:empty, .g-rivals:empty { display: none; }
.card { background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.specimen { overflow: hidden; }
.specimen .art { border-bottom: 1px solid var(--line); }
.creature { display: block; width: 100%; height: auto; }
.creature path, .creature ellipse, .creature circle, .creature rect { vector-effect: non-scaling-stroke; }
/* 細輪廓線和細的特效線維持固定粗細；用粗線畫成的肢體、脖子、尾鰭（.nsk）是身體的形狀，要跟著圖一起縮放，否則縮圖裡會腫成一團 */
.creature .nsk { vector-effect: none; }
.cr-bob { animation: bob 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.is-micro .cr-bob { animation-name: wobble; animation-duration: 4.4s; }
.is-invis { opacity: .5; }
.is-rad { filter: drop-shadow(0 0 3px rgb(80 220 130 / .9)); }
.is-fossil .cr-body { filter: grayscale(1) sepia(.35) contrast(.9) brightness(1.05); opacity: .85; }
@keyframes bob { 50% { transform: translateY(-3px); } }
@keyframes wobble { 33% { transform: rotate(-2deg) translateY(-2px); } 66% { transform: rotate(2deg) translateY(1px); } }
.specimen.just-mutated .art { animation: flash .9s ease-out; }
@keyframes flash { 0% { filter: brightness(1.35) saturate(1.3); } 100% { filter: none; } }
.spec-body { padding: 12px 14px 14px; display: grid; gap: 6px; }
.spec-name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.spec-name h2 { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.2; }
.spec-name .cls { font-size: 13px; padding: 1px 10px; border-radius: 999px; background: var(--amber-soft); color: var(--warn); font-weight: 600; }
.spec-sci { font-family: var(--font-data); font-size: 13px; color: var(--muted); }
.spec-sci i { color: var(--ink); }
.spec-meta { font-size: 13px; color: var(--muted); }

.vitals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.vital { padding: 10px 12px; display: grid; gap: 6px; }
.vital.wide { grid-column: 1 / -1; }
.vital-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.vital-top span { font-size: 13px; color: var(--muted); }
.vital-top b { font-size: 20px; }
.vital small { font-size: 12px; color: var(--muted); line-height: 1.4; }
.meter { height: 8px; border-radius: 999px; background: var(--chip); overflow: hidden; }
.meter i { display: block; height: 100%; width: var(--w); background: var(--fill, var(--good)); border-radius: inherit; transition: width .7s cubic-bezier(.2,.8,.2,1); }
.vital.pop .meter i { --fill: var(--good); }
.vital.pop.low .meter i { --fill: var(--bad); }
.vital.div .meter i { --fill: #5E8FA8; }
.vital.dom { border-color: color-mix(in srgb, var(--sci) 45%, var(--line)); }
.vital.dom .meter i { --fill: linear-gradient(90deg, var(--sci), #D35AA8); }
.vital.dom b { color: var(--sci); }

.forecast { display: grid; gap: 6px; }
.fc { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 12px; border: 1.5px solid; font-size: 14px; }
.fc .when { font-family: var(--font-data); font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.fc.mass { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); background: color-mix(in srgb, var(--bad) 8%, var(--paper)); }
.fc.mass .when { background: var(--bad); color: var(--paper); }
.fc.other { border-color: var(--line); background: var(--paper); }
.fc.other .when { background: var(--chip); }
.fc b { font-weight: 600; }

.env { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile { padding: 9px 10px; display: grid; gap: 1px; min-width: 0; }
.tile .lab { font-size: 12px; color: var(--muted); }
.tile .val { font-weight: 600; font-size: 15px; line-height: 1.35; }
.tile .st { font-size: 12px; line-height: 1.35; }
.tile .st.bad { color: var(--bad); }
.tile .st.good { color: var(--good); }
.tile .st.ok { color: var(--muted); }
.outlook { font-size: 13.5px; color: var(--muted); padding: 0 2px; }
.outlook b { color: var(--ink); }

.choose h2 { font-family: var(--font-display); font-size: 22px; }
.choose > p { margin: 2px 0 10px; color: var(--muted); font-size: 14px; }
.opts { display: grid; gap: 10px; }
.opt { position: relative; display: grid; gap: 6px; padding: 12px 14px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--paper); cursor: pointer; transition: border-color .15s, transform .12s; animation: rise .35s calc(var(--i) * 60ms) both; }
@keyframes rise { from { transform: translateY(6px); } }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt:hover { border-color: var(--muted); }
.opt:has(input:checked) { border-color: var(--amber); box-shadow: inset 0 0 0 1.5px var(--amber); }
.opt:has(input:focus-visible) { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.opt-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.opt-cat { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
.opt-check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.opt:has(input:checked) .opt-check { border-color: var(--amber); background: var(--amber); }
.opt:has(input:checked) .opt-check::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--on-amber); }
.opt-name { font-family: var(--font-display); font-size: 20px; font-weight: 700; line-height: 1.25; }
.opt-desc { font-size: 14px; color: var(--muted); }
.opt.is-sci { border-color: color-mix(in srgb, var(--sci) 50%, var(--line)); background: linear-gradient(160deg, var(--sci-soft), var(--paper) 55%); }
.opt.is-sci .opt-cat { color: var(--sci); font-weight: 700; }
.opt.is-sci:has(input:checked) { border-color: var(--sci); box-shadow: inset 0 0 0 1.5px var(--sci); }
.opt.is-sci:has(input:checked) .opt-check { border-color: var(--sci); background: var(--sci); }
.opt.is-key .opt-cat { color: var(--good); font-weight: 700; }
.opt.is-skip { background: transparent; border-style: dashed; }
.boost { font-size: 13px; color: var(--sci); background: var(--sci-soft); padding: 6px 10px; border-radius: 10px; margin-bottom: 10px; }

details.panel { padding: 0; }
details.panel > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: "＋"; color: var(--muted); }

/* ---------- action bar ---------- */
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }

.auto input { width: 18px; height: 18px; accent-color: var(--amber); }
.toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 60; max-width: min(560px, calc(100vw - 32px)); padding: 10px 14px; border-radius: 12px; background: var(--ink); color: var(--paper); font-size: 14px; box-shadow: 0 10px 30px -10px rgb(0 0 0 / .45); animation: toast-in .35s cubic-bezier(.2,.9,.3,1.2) both; pointer-events: none; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, -12px); } }

/* ---------- result sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgb(10 14 12 / .45); display: grid; align-items: end; justify-items: center; animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: min(640px, 100%); max-height: min(88vh, 900px); overflow: auto; background: var(--paper); border-radius: 20px 20px 0 0; border: 1.5px solid var(--line); border-bottom: 0; padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); animation: up .32s cubic-bezier(.2,.8,.2,1) both; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@keyframes up { from { transform: translateY(40px); } }
.sheet-head { display: grid; gap: 4px; }
.sheet-head .meta { font-size: 12.5px; color: var(--muted); }
.sheet-head h2 { font-family: var(--font-display); font-size: 28px; line-height: 1.2; }
.kind { justify-self: start; font-size: 12px; font-weight: 700; letter-spacing: .08em; padding: 2px 10px; border-radius: 999px; background: var(--chip); }
.kind.mass, .kind.final { background: var(--bad); color: var(--paper); }
.kind.boon { background: color-mix(in srgb, var(--good) 18%, var(--paper)); color: var(--good); }
.kind.climate { background: #DDE9F0; color: #24566E; }
:root[data-theme="dark"] .kind.climate { background: #1C3340; color: #9CCBE2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kind.climate { background: #1C3340; color: #9CCBE2; } }
.sheet p { margin: 0; }
.fact { font-size: 13.5px; background: var(--amber-soft); border-radius: 10px; padding: 9px 12px; }
.fact b { margin-right: 6px; }
.note { font-size: 13.5px; color: var(--sci); background: var(--sci-soft); border-radius: 10px; padding: 9px 12px; }
.popchange { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: end; padding: 12px 14px; border-radius: 14px; background: var(--chip); }
.popchange .big { font-size: 30px; font-weight: 600; line-height: 1.1; }
.popchange .big .arrow { font-size: 20px; margin: 0 4px; color: var(--muted); }
.popchange .delta { font-size: 18px; font-weight: 600; }
.delta.up { color: var(--good); }
.delta.down { color: var(--bad); }
.popchange .sub { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.factors { display: grid; gap: 5px; }
.factors h3, .sheet h3 { font-size: 13px; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.fx { display: grid; grid-template-columns: minmax(0, 1fr) 96px 3em; gap: 8px; align-items: center; font-size: 13.5px; }
.fx .lbl { min-width: 0; }
.fx .bar2 { position: relative; height: 8px; background: linear-gradient(90deg, transparent calc(50% - .5px), var(--line) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)); }
.fx .bar2 i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.fx .bar2 i.neg { right: 50%; background: var(--bad); }

.mutbox { border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 6px; }

.namebox { border: 1.5px dashed var(--amber); border-radius: 14px; padding: 10px 12px; font-size: 14px; }
.namebox .g { font-family: var(--font-data); font-size: 18px; font-style: italic; }
.extinct-stamp { font-family: var(--font-display); font-size: 40px; color: var(--bad); border: 3px solid var(--bad); border-radius: 12px; padding: 2px 14px; transform: rotate(-4deg); justify-self: start; }
.domchange { display: grid; gap: 6px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid color-mix(in srgb, var(--sci) 45%, var(--line)); }

/* ---------- end ---------- */
.end { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }

/* ---------- help ---------- */

@media (min-width: 980px) {

}

/* ---------- 時間流逝：時鐘、控制列、日誌 ---------- */

.skip-anim { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 30; border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-size: 13px; box-shadow: var(--shadow); }

.strip .arrow { flex: none; align-self: center; color: var(--muted); font-size: 18px; margin-top: -26px; }
@media (prefers-reduced-motion: reduce) {
  .end.extinct .end-hero svg, .end.sunset .end-hero svg { filter: grayscale(1) sepia(.45) contrast(.88) brightness(.96); }
  .sediment { height: 34%; }
  .rocket { display: none; }
}

.ticker { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 0; margin: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.ticker::before { content: "最新"; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--paper); background: var(--muted); border-radius: 4px; padding: 0 5px; margin-right: 6px; }
.ticker.flash { animation: tick-in .5s ease-out both; color: var(--ink); }
@keyframes tick-in { from { transform: translateY(4px); opacity: .2; } }

/* ---------- 族群重心 ---------- */
.focus { padding: 12px 12px 12px; display: grid; gap: 10px; }
.focus-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; padding: 0 2px; }
.focus-head h2, .rv-head h2 { font-family: var(--font-display); font-size: 19px; }
.focus-head .muted { font-size: 12px; }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.seg-i { position: relative; display: grid; justify-items: center; gap: 1px; padding: 8px 4px 7px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); cursor: pointer; text-align: center; transition: border-color .15s, background .15s, transform .12s; }
.seg-i input { position: absolute; opacity: 0; pointer-events: none; }
.seg-i:hover { border-color: var(--muted); }
.seg-i:active { transform: scale(.97); }
.seg-i:has(input:focus-visible) { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.seg-i .seg-ic { color: var(--muted); line-height: 0; }
.seg-i b { font-size: 14.5px; font-weight: 600; }
.seg-i small { font-size: 11.5px; color: var(--muted); }
.seg-i small.good { color: var(--good); }
.seg-i small.bad { color: var(--bad); }
.seg-i.on { border-color: var(--amber); background: var(--amber-soft); box-shadow: inset 0 0 0 1px var(--amber); }
.seg-i.on .seg-ic { color: var(--amber); }
.seg-i .tip { position: absolute; top: -8px; right: -4px; font-style: normal; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; padding: 0 6px; border-radius: 999px; background: var(--good); color: var(--paper); line-height: 1.6; }
.focus-desc { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; padding: 0 2px; }
.focus-desc b { color: var(--ink); margin-right: 6px; }
.seg-sm .seg-i { padding: 6px 2px 5px; }
.seg-sm .seg-i b { font-size: 13.5px; }
.sheet-focus { display: grid; gap: 8px; }
.sheet-focus h3 { font-size: 13px; letter-spacing: .1em; color: var(--muted); font-weight: 600; }

/* ---------- 同時出發的物種 ---------- */
.rivals { padding: 12px; display: grid; gap: 10px; }
.rv-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 2px; }
.rv-head .muted { font-size: 12.5px; }
.rv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.riv { position: relative; display: grid; grid-template-columns: 58px minmax(0, 1fr); align-items: center; gap: 8px; padding: 6px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); text-align: left; min-height: 56px; transition: border-color .15s, opacity .3s; }
.riv:hover { border-color: var(--muted); }
.rv-art { display: block; border-radius: 7px; overflow: hidden; border: 1px solid var(--line); line-height: 0; }
.rv-txt { display: grid; gap: 2px; min-width: 0; }
.rv-txt b { font-size: 14px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv-txt small { font-size: 11.5px; color: var(--muted); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter.sm { height: 5px; margin-top: 2px; }
.rv-dead { font-size: 11.5px; color: var(--bad); font-weight: 600; line-height: 1.3; }
.riv.dead { background: color-mix(in srgb, var(--chip) 60%, var(--paper)); }
.riv.dead .rv-txt b { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.riv.just-died { animation: rv-die 1.2s ease-out both; }
@keyframes rv-die { 0% { transform: scale(1.04); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 50%, transparent); } 100% { transform: none; box-shadow: none; } }
.rel { position: absolute; top: -7px; right: 6px; font-size: 10.5px; font-weight: 700; padding: 0 7px; border-radius: 999px; line-height: 1.6; letter-spacing: .03em; }
.rel-pred { background: var(--bad); color: var(--paper); }
.rel-prey { background: var(--good); color: var(--paper); }
.rel-comp { background: var(--amber-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent); }
.sheet .rel { position: static; display: inline-block; margin-right: 8px; vertical-align: 1px; }
.rv-big { overflow: hidden; }
.rv-big.dead .art { opacity: .9; }
.rv-status { display: grid; gap: 2px; }
.rv-status b { font-size: 16px; }
.rv-status .muted { font-size: 13px; }
.sheet .journey { padding: 0; }
.sheet .journey h3, .sheet .journey .strip { padding-inline: 0; }

/* ---------- 日誌：新的條目 ---------- */
.fe.focus .fe-b b { color: var(--amber); }
.fe.tp { background: color-mix(in srgb, var(--amber) 12%, transparent); }
.fe.tp .tagk { background: var(--amber); color: var(--on-amber); }
.fe.tpres .fe-b > b { font-family: var(--font-display); font-size: 16px; }
.fe.tpres.good { background: color-mix(in srgb, var(--good) 8%, transparent); }
.fe.tpres.bad { background: color-mix(in srgb, var(--bad) 8%, transparent); }
.okk { display: inline-block; margin-left: 8px; font-size: 11.5px; font-weight: 700; padding: 0 8px; border-radius: 999px; vertical-align: 2px; }
.okk.good { background: var(--good); color: var(--paper); }
.okk.bad { background: var(--bad); color: var(--paper); }
.fe.eco .fe-b { font-size: 13.5px; }
.fe.eco .fe-b > b, .fe.real .fe-b > b, .fe.tip .fe-b > b { margin-right: 8px; }
.fe.eco .fe-b > b { color: var(--warn); }
.fe.real { background: color-mix(in srgb, var(--sci) 8%, transparent); }
.fe.real .fe-b > b { color: var(--sci); }
.fe.rival .fe-b { color: var(--muted); font-size: 13.5px; }
.fe.rival .fe-b b { color: var(--ink); }
.fe.rival.dead .fe-b { color: var(--ink); }
.fe.rival.dead .fe-b > b { color: var(--bad); }
.fe.ach { background: color-mix(in srgb, var(--amber) 10%, transparent); }
.fe.ach .fe-b b { color: var(--amber); }
.fe.dex .fe-b { color: var(--muted); font-size: 13.5px; }
.fe.dex .fe-b b { color: var(--good); }
.fe.note2 q { display: block; margin-top: 2px; font-family: var(--font-display); font-size: 16px; }
.fe.tip .fe-b { font-size: 13.5px; color: var(--muted); }
.fe.tip .fe-b > b { color: var(--good); }
.live.warn { color: var(--amber); font-weight: 600; }
.log .lt { display: block; font-size: 12px; color: var(--warn); }

/* ---------- 轉折點 ---------- */
.kind.tpk { background: var(--amber); color: var(--on-amber); }
.kind.tpk.hot { background: var(--bad); color: var(--paper); animation: hot 1.1s ease-in-out infinite; }
@keyframes hot { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--bad) 22%, transparent); } }
.sheet-tp .sheet-head h2 { font-size: 26px; }
.tp-timer { height: 10px; border-radius: 999px; background: var(--chip); overflow: hidden; }
.tp-timer i { display: block; height: 100%; background: linear-gradient(90deg, var(--bad), var(--amber)); transform-origin: left center; transition: transform .1s linear; }
.tp-left { margin: -8px 0 0 !important; font-size: 12.5px; color: var(--bad); font-weight: 600; text-align: right; }
.odds { font-size: 11.5px; font-weight: 700; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.odds-high { background: color-mix(in srgb, var(--good) 16%, var(--paper)); color: var(--good); }
.odds-mid { background: var(--amber-soft); color: var(--warn); }
.odds-low { background: color-mix(in srgb, var(--bad) 13%, var(--paper)); color: var(--bad); }
.tp-opt .opt-cat { letter-spacing: 0; }
.scrim.lock { cursor: default; }

/* ---------- 回顧時刻 ---------- */
.compare { display: flex; align-items: stretch; justify-content: center; gap: 8px; }
.compare .form { width: auto; flex: 1 1 0; max-width: 220px; }
.compare .arrow { align-self: center; color: var(--muted); font-size: 20px; margin-top: -26px; }
.cmp { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.cmp li { display: grid; gap: 0; padding: 7px 10px; border-radius: 10px; background: var(--chip); }
.cmp li span { font-size: 12px; color: var(--muted); }
.cmp li b { font-size: 15px; }
.ask { display: grid; gap: 8px; }
.ask label { font-family: var(--font-display); font-size: 17px; line-height: 1.5; }
.ask input { min-height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); padding: 8px 14px; font-size: 16px; }

/* ---------- 首頁 ---------- */
.counters { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.7; max-width: 34em; }
.counters b { color: var(--ink); font-weight: 600; }
.home-actions .btn-primary { flex: 1 1 auto; }
.collect { margin: 10px 0 0; font-size: 13px; }
.collect b { color: var(--ink); font-weight: 600; }
.snd { display: inline-flex; align-items: center; gap: 6px; }
.snd svg { flex: none; }
.btn.snd.on, .icon-btn.snd.on { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 55%, var(--line)); }
.tl-right { display: inline-flex; align-items: center; gap: 8px; }
.icon-btn.snd { min-height: 30px; padding: 2px 10px 2px 8px; font-size: 12px; gap: 4px; }
.pick-note { font-size: 13px; margin: 12px 2px 0; }

/* ---------- 隨機投胎 ---------- */
.roll-box { display: grid; justify-items: center; gap: 8px; padding: 16px 12px; border-radius: 16px; border: 1.5px dashed var(--line); text-align: center; min-height: 260px; align-content: center; }
.roll-era { font-size: 13px; font-weight: 600; padding: 2px 12px; border-radius: 999px; }
.roll-art { width: min(260px, 70vw); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); line-height: 0; }
.roll-name { font-family: var(--font-display); font-size: 28px; line-height: 1.2; }
.roll-blurb { margin: 0; font-size: 14px; color: var(--muted); max-width: 30em; }
.roll-box.landed { border-style: solid; border-color: var(--amber); animation: land .5s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes land { from { transform: scale(.94); } }

/* ---------- 結局：排名、留言、成就 ---------- */
.ranking { padding: 12px 14px 14px; display: grid; gap: 8px; }
.ranking h3, .notes h3, .achs h3 { font-size: 13px; letter-spacing: .1em; color: var(--muted); }
.rk-sum { margin: 0; font-size: 14.5px; }
.rk-sum .muted { display: block; font-size: 12.5px; margin-top: 2px; }
.rk-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rk { display: grid; grid-template-columns: 1.4em 64px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 12px; border: 1.5px solid transparent; }
.rk.you { border-color: var(--amber); background: var(--amber-soft); }
.rk-n { font-size: 16px; font-weight: 600; color: var(--muted); text-align: center; }
.rk.you .rk-n { color: var(--amber); }
.rk-art { display: block; border-radius: 7px; overflow: hidden; border: 1px solid var(--line); line-height: 0; }
.rk-body { display: grid; gap: 2px; min-width: 0; }
.rk-body b { font-size: 15px; }
.rk-body small { font-size: 12px; color: var(--muted); line-height: 1.5; }
.you-tag { font-style: normal; font-size: 11px; font-weight: 700; margin-left: 6px; padding: 0 7px; border-radius: 999px; background: var(--amber); color: var(--on-amber); vertical-align: 2px; }
.rk-bar { height: 6px; border-radius: 999px; background: var(--chip); overflow: hidden; }
.rk-bar i { display: block; height: 100%; width: var(--w); background: var(--good); border-radius: inherit; animation: grow 1s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0ms); transform-origin: left; }
.rk.dead .rk-bar i { background: var(--muted); }
.rk.you .rk-bar i { background: var(--amber); }
@keyframes grow { from { transform: scaleX(0); } }
.rk-span { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.end.skip .rk-bar i, .end.skip .ach-chip { animation-delay: 0s !important; animation-duration: 0s !important; }
.notes { padding: 12px 14px; display: grid; gap: 8px; }
.notes ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.notes li { display: grid; grid-template-columns: 6.6em minmax(0, 1fr); gap: 8px; font-size: 13.5px; }
.notes .t { font-size: 11.5px; color: var(--muted); padding-top: 2px; }
.notes q { display: block; font-family: var(--font-display); font-size: 17px; }
.achs { padding: 12px 14px; display: grid; gap: 8px; }
.ach-row { display: flex; flex-wrap: wrap; gap: 8px; }
.ach-chip { display: grid; gap: 0; padding: 6px 12px; border-radius: 12px; background: var(--amber-soft); border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent); animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; animation-delay: var(--d, 0ms); }
.ach-chip b { font-size: 14px; color: var(--warn); }
.ach-chip small { font-size: 12px; color: var(--muted); }

/* ---------- 化石館分頁 ---------- */
.tabs { display: flex; gap: 2px; margin: 0 0 14px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; white-space: nowrap; border: 0; background: transparent; padding: 8px 11px 10px; font-weight: 600; font-size: 15px; color: var(--muted); border-bottom: 2.5px solid transparent; }
.tab .num { font-size: 12px; font-weight: 500; }
.tab.on { color: var(--ink); border-bottom-color: var(--amber); }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.ach { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; padding: 10px 12px; align-items: start; }
.ach > div { display: grid; gap: 1px; }
.ach b { font-size: 15px; }
.ach small { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.ach .when { font-size: 11px; }
.ach-ic { font-size: 20px; line-height: 1.2; color: var(--line); }
.ach.got .ach-ic { color: var(--amber); }
.ach:not(.got) b { color: var(--muted); }
.dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.dex { margin: 0; padding: 8px; display: grid; gap: 6px; align-content: start; }
.dex .mini { border-radius: 8px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 16 / 10; display: grid; place-items: center; background: var(--chip); line-height: 0; }
.dex .q { font-family: var(--font-display); font-size: 30px; color: var(--muted); line-height: 1; }
.dex figcaption { display: grid; gap: 1px; }
.dex figcaption b { font-size: 14px; }
.dex figcaption small { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
.dex:not(.got) figcaption b { color: var(--muted); }

@media (max-width: 420px) {
  .seg-i b { font-size: 13.5px; }
  .riv { grid-template-columns: 48px minmax(0, 1fr); gap: 6px; padding: 5px; }
  .rk { grid-template-columns: 1.2em 52px minmax(0, 1fr) auto; gap: 8px; padding: 6px 4px; }
  .compare .arrow { display: none; }
  .home-actions .btn { padding-inline: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .rk-bar i { transform: none; }
}

/* ---------- 虛構／真實標示 ---------- */
.fic, .realtag { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; font-family: var(--font-body); font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .04em; line-height: 1.6; vertical-align: 1px; white-space: nowrap; }
.fic { color: var(--sci); background: var(--sci-soft); border: 1px dashed color-mix(in srgb, var(--sci) 65%, transparent); }
.realtag { color: var(--good); background: color-mix(in srgb, var(--good) 11%, var(--paper)); border: 1px solid color-mix(in srgb, var(--good) 35%, transparent); }
.fic.sm, .realtag.sm { font-size: 10px; padding: 0 5px; margin-left: 4px; line-height: 1.45; letter-spacing: .02em; }
.spec-sci .lab { font-family: var(--font-body); font-size: 11.5px; color: var(--muted); margin-right: 7px; }
.spec-sci .sp-zh { font-family: var(--font-body); font-size: 14.5px; color: var(--ink); margin-right: 2px; }
.sp-parts { font-size: 12px; color: var(--muted); line-height: 1.45; }
.fe.name .sp-new { font-family: var(--font-display); font-size: 17px; color: var(--sci); }
.fe.name .fe-b { font-size: 14px; }
.form figcaption .fc-sp { color: var(--ink); font-family: var(--font-body); font-size: 12.5px; line-height: 1.8; }
.rv-txt small .fic { vertical-align: 0; }

/* ---------- 首頁設定 ---------- */
.settings { margin-top: 14px; padding: 2px 14px 2px; }
.settings h2 { font-size: 13px; letter-spacing: .1em; color: var(--muted); font-weight: 600; padding: 10px 0 0; }
.sw-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 0 12px; border-top: 1px solid var(--line); cursor: pointer; }
.settings h2 + .sw-row { border-top: 0; padding-top: 6px; }
.sw-txt { display: grid; gap: 2px; min-width: 0; }
.sw-txt b { font-size: 15px; }
.sw-txt small { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.sw { appearance: none; -webkit-appearance: none; flex: none; width: 48px; height: 28px; margin: 0; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .35); transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.sw:checked { background: var(--amber); }
.sw:checked::after { transform: translateX(20px); }
.sw:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.thm-seg { display: inline-flex; flex: none; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--paper); }
.thm-seg label { position: relative; padding: 5px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; border-left: 1px solid var(--line); }
.thm-seg label:first-child { border-left: 0; }
.thm-seg input { position: absolute; opacity: 0; pointer-events: none; }
.thm-seg label:has(input:checked) { background: var(--amber-soft); color: var(--warn); }
.thm-seg label:has(input:focus-visible) { outline: 2.5px solid var(--focus); outline-offset: -3px; }
.icon-btn.thm { min-height: 30px; min-width: 32px; padding: 2px 7px; display: inline-flex; align-items: center; justify-content: center; }
.icon-btn.thm svg { flex: none; }

/* ---------- 選生物：方格 ---------- */
.pick-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 2px 2px 10px; }
.pick-head h3 { font-family: var(--font-display); font-size: 20px; }
.pick-head .muted { font-size: 12.5px; text-align: right; }
.ctiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.ctile { position: relative; display: grid; gap: 3px; justify-items: start; align-content: start; padding: 5px 5px 8px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); cursor: pointer; min-width: 0; transition: border-color .15s, transform .12s, background .15s; }
.ctile input { position: absolute; opacity: 0; pointer-events: none; }
.ctile:hover { border-color: var(--muted); }
.ctile:active { transform: scale(.98); }
.ctile:has(input:checked) { border-color: var(--amber); background: var(--amber-soft); box-shadow: inset 0 0 0 1px var(--amber); }
.ctile:has(input:focus-visible) { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.ct-art { display: block; width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); line-height: 0; }
.ct-name { font-size: 14px; line-height: 1.3; padding: 0 3px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctile .pips { padding: 0 3px; }
.crit-detail { grid-column: 1 / -1; position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 10px; margin: 4px 0 6px; border-color: var(--amber); scroll-margin: 16px 0 100px; animation: rise .3s cubic-bezier(.2,.8,.2,1) both; }
.crit-detail::before { content: ""; position: absolute; top: -8.5px; left: calc(var(--cx, 50%) - 8px); width: 14px; height: 14px; background: var(--paper); border-left: 1.5px solid var(--amber); border-top: 1.5px solid var(--amber); border-top-left-radius: 3px; transform: rotate(45deg); }
.cd-art { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); line-height: 0; align-self: start; }
.cd-body { display: grid; gap: 6px; align-content: start; padding: 0 4px 4px; min-width: 0; }
.cd-body p { margin: 0; }
.crit-facts { font-size: 12.5px; color: var(--muted); }
.cd-fact { font-size: 13px; color: var(--muted); line-height: 1.55; }

      t: { size: 2, armor: 4, speed: 2, heat: 4, cold: 3, smart: 1, fert: 7 }, flags: ['gills', 'eyes'], hue: 32, look: 'trilobite',
      blurb: '身體分成三葉的節肢動物，在海底爬行、翻找有機碎屑。',
      fact: '三葉蟲在地球上存在了約 2.7 億年，最後在二疊紀末的大滅絕中消失。' },
    anomalocaris: { name: '奇蝦', sci: 'Anomalocaris', diff: 4, fdiff: 4, tip: '頂級掠食者得一直跟上獵物的演化，否則就會餓肚子。', plan: 'arthropod', habitat: 'sea', diet: 'carn',
      t: { size: 5, armor: 1, speed: 6, heat: 4, cold: 3, smart: 2, fert: 4 }, flags: ['gills', 'eyes'], hue: 352, look: 'anomalocaris',
      blurb: '寒武紀海洋的頂級掠食者，用頭前一對大觸肢抓住獵物。',
      fact: '奇蝦的化石最早是零散的碎片，科學家曾把牠的觸肢誤認成一種蝦，所以取名「奇怪的蝦」。' },
    pikaia: { name: '皮卡蟲', sci: 'Pikaia', diff: 3, fdiff: 3, tip: '先長出鰓和脊椎，才有本錢長大。', plan: 'chordate', habitat: 'sea', diet: 'filter',
      t: { size: 1, armor: 0, speed: 3, heat: 4, cold: 3, smart: 1, fert: 7 }, flags: [], hue: 186, look: 'pikaia',
      blurb: '像小鰻魚一樣的早期脊索動物，背上有一條支撐身體的脊索。',
      fact: '皮卡蟲身體裡的「脊索」是脊椎的前身，牠常被用來說明脊椎動物最早期的模樣。' },

    dunkleosteus: { name: '鄧氏魚', sci: 'Dunkleosteus', diff: 5, fdiff: 5, tip: '厚重的盔甲在缺氧、變酸的海洋裡幫不上忙。', plan: 'chordate', habitat: 'sea', diet: 'carn',
      t: { size: 7, armor: 7, speed: 4, heat: 4, cold: 3, smart: 2, fert: 3 }, flags: ['gills', 'spine', 'jaws'], hue: 212, look: 'placoderm',
      blurb: '頭部包著厚重骨板的盾皮魚，用刀片般的骨質顎咬碎獵物。',
      fact: '鄧氏魚沒有真正的牙齒，而是用會互相磨利的骨板當刀刃，咬合力非常驚人。' },
    tiktaalik: { name: '提塔利克魚', sci: 'Tiktaalik', diff: 4, fdiff: 4, tip: '你已經有肺了。泥盆紀晚期海水缺氧，正是爬上岸的好理由。', plan: 'chordate', habitat: 'sea', diet: 'carn',
      t: { size: 4, armor: 3, speed: 3, heat: 5, cold: 3, smart: 2, fert: 5 }, flags: ['gills', 'spine', 'jaws', 'lungs'], hue: 96, look: 'lobefin',
      blurb: '有鰓也有肺的肉鰭魚，鰭裡已經長出類似手腕的骨頭。',
      fact: '提塔利克魚有能轉動的脖子。這是一般魚類沒有、但陸地脊椎動物都有的特徵。' },
    ammonite: { name: '菊石', sci: 'Ammonoidea', diff: 4, fdiff: 4, tip: '靠浮游生物維生，海洋食物鏈崩潰時最危險。', plan: 'mollusc', habitat: 'sea', diet: 'filter',
      t: { size: 3, armor: 5, speed: 3, heat: 4, cold: 3, smart: 2, fert: 7 }, flags: ['gills'], hue: 30, look: 'ammonite',
      blurb: '住在螺旋外殼裡的頭足類，是章魚和烏賊的遠親。',
      fact: '菊石在海洋中繁盛了超過 3 億年，最後在白堊紀末和恐龍一起滅絕。' },

    meganeura: { name: '巨脈蜻蜓', sci: 'Meganeura', diff: 3, fdiff: 4, tip: '高含氧量撐起了巨大的翅膀，氧氣一下降就麻煩了。', plan: 'arthropod', habitat: 'air', diet: 'carn',
      t: { size: 3, armor: 2, speed: 8, heat: 5, cold: 2, smart: 2, fert: 6 }, flags: ['trachea', 'wings', 'eyes'], hue: 168, look: 'dragonfly',
      blurb: '翼展約 70 公分的巨大昆蟲，在石炭紀的森林上空獵食。',
      fact: '石炭紀大氣含氧量可能高達 30% 以上，這被認為是當時昆蟲能長得這麼大的原因之一。' },
    hylonomus: { name: '林蜥', sci: 'Hylonomus', diff: 3, fdiff: 3, tip: '羊膜卵讓你不怕乾燥，但三疊紀會非常炎熱。', plan: 'chordate', habitat: 'land', diet: 'carn', lineage: 'sau',
      t: { size: 2, armor: 2, speed: 4, heat: 5, cold: 3, smart: 2, fert: 5 }, flags: ['spine', 'jaws', 'lungs', 'limbs', 'amnion'], hue: 44, look: 'lizard',
      blurb: '目前已知最早的爬蟲類之一，靠捕食昆蟲和小型節肢動物維生。',
      fact: '林蜥的化石是在加拿大的古老樹樁裡找到的，牠可能是躲進中空的樹幹時被困住。' },
    arthropleura: { name: '節胸蜈蚣', sci: 'Arthropleura', diff: 5, fdiff: 5, tip: '二疊紀以後氧氣變少，巨大的身體會喘不過氣。', plan: 'arthropod', habitat: 'land', diet: 'detri',
      t: { size: 6, armor: 6, speed: 2, heat: 4, cold: 3, smart: 1, fert: 4 }, flags: ['trachea'], hue: 18, look: 'millipede',
      blurb: '巨型的千足蟲類，在森林地面上吃腐爛的植物。',
      fact: '節胸蜈蚣是史上最大的陸生節肢動物，體長可能超過 2.5 公尺，比一個成年人還長。' },

    dimetrodon: { name: '異齒龍', sci: 'Dimetrodon', diff: 5, fdiff: 5, tip: '再過兩個回合，就是史上最嚴重的大滅絕。', plan: 'chordate', habitat: 'land', diet: 'carn', lineage: 'syn',
      t: { size: 6, armor: 3, speed: 4, heat: 6, cold: 4, smart: 2, fert: 4 }, flags: ['spine', 'jaws', 'lungs', 'limbs', 'amnion', 'sail'], hue: 12, look: 'sailback',
      blurb: '背上有大帆的掠食者，是二疊紀早期陸地上的霸主。',
      fact: '異齒龍不是恐龍！牠屬於合弓類，和哺乳類的親緣關係反而比和恐龍更近。' },
    lystrosaurus: { name: '水龍獸', sci: 'Lystrosaurus', diff: 2, fdiff: 3, tip: '會挖洞又不挑食，是撐過大滅絕的本錢。', plan: 'chordate', habitat: 'land', diet: 'herb', lineage: 'syn',
      t: { size: 3, armor: 2, speed: 3, heat: 6, cold: 4, smart: 2, fert: 6 }, flags: ['spine', 'jaws', 'lungs', 'limbs', 'amnion', 'burrow'], hue: 70, look: 'dicynodont',
      blurb: '像小豬一樣壯實的草食動物，有一對小獠牙和角質的喙。',
      fact: '水龍獸撐過了二疊紀末大滅絕，在三疊紀初期一度成為陸地上最常見的動物。' },
    mesosaurus: { name: '中龍', sci: 'Mesosaurus', diff: 3, fdiff: 4, tip: '用肺呼吸，在缺氧的海裡比魚類更有優勢。', plan: 'chordate', habitat: 'sea', diet: 'carn', lineage: 'sau',
      t: { size: 3, armor: 1, speed: 5, heat: 5, cold: 3, smart: 2, fert: 5 }, flags: ['spine', 'jaws', 'lungs', 'limbs', 'amnion', 'flippers'], hue: 200, look: 'marine',
      blurb: '回到水中生活的早期爬蟲類，用細長的牙齒過濾小型甲殼類。',
      fact: '中龍的化石同時出現在南美洲和非洲南部，是「大陸漂移」理論的重要證據。' },

    allosaurus: { name: '異特龍', sci: 'Allosaurus', diff: 3, fdiff: 4, tip: '小行星終究會來，大型肉食動物最難撐過饑荒。', plan: 'chordate', habitat: 'land', diet: 'carn', lineage: 'sau',
      t: { size: 8, armor: 3, speed: 6, heat: 6, cold: 3, smart: 3, fert: 4 }, flags: ['spine', 'jaws', 'lungs', 'limbs', 'amnion', 'biped', 'airsac', 'dino'], hue: 28, look: 'theropod',
      blurb: '侏羅紀晚期最常見的大型肉食恐龍，體長約 9 公尺。',
      fact: '異特龍的頭骨很輕。有假說認為牠會張大嘴，像揮斧頭一樣用上顎砍向獵物。' },
    diplodocus: { name: '梁龍', sci: 'Diplodocus', diff: 5, fdiff: 5, tip: '小行星撞擊對巨大的動物特別致命，得盡快縮小體型。', plan: 'chordate', habitat: 'land', diet: 'herb', lineage: 'sau',
      t: { size: 10, armor: 3, speed: 2, heat: 6, cold: 3, smart: 1, fert: 3 }, flags: ['spine', 'jaws', 'lungs', 'limbs', 'amnion', 'airsac', 'dino'], hue: 100, look: 'sauropod',
      blurb: '長達 25 公尺以上的蜥腳類恐龍，靠長脖子吃大範圍的植物。',
      fact: '梁龍雖然很長，體重卻只有十幾公噸，因為牠的脊椎骨裡有許多充滿空氣的空腔。' },
    morganucodon: { name: '摩根齒獸', sci: 'Morganucodon', diff: 1, fdiff: 2, tip: '小而不起眼，正是哺乳類撐過恐龍時代的方法。', plan: 'chordate', habitat: 'land', diet: 'carn', lineage: 'syn',
      t: { size: 1, armor: 0, speed: 5, heat: 3, cold: 4, smart: 3, fert: 7 }, flags: ['spine', 'jaws', 'lungs', 'limbs', 'amnion', 'endo', 'fur', 'nocturnal'], hue: 26, look: 'shrew',
      blurb: '像鼩鼱一樣的早期哺乳類親戚，晚上出來捕食昆蟲。',
      fact: '摩根齒獸只有約 10 公分長。在恐龍稱霸的上億年裡，哺乳類的祖先大多是這樣的小型夜行動物。' },

    velociraptor: { name: '迅猛龍', sci: 'Velociraptor', diff: 1, fdiff: 2, tip: '小型、有羽毛、恆溫：你和鳥類的祖先很像。', plan: 'chordate', habitat: 'land', diet: 'carn', lineage: 'sau',
      t: { size: 2, armor: 1, speed: 7, heat: 5, cold: 3, smart: 4, fert: 5 }, flags: ['spine', 'jaws', 'lungs', 'limbs', 'amnion', 'biped', 'airsac', 'feathers', 'endo', 'dino'], hue: 36, look: 'raptor',
      blurb: '聰明敏捷的小型獵食恐龍，後腳有一根大鉤爪。',
      fact: '真正的迅猛龍（正式中文名為伶盜龍）大約只有火雞大小，身上還有羽毛，和電影裡很不一樣。' },
    triceratops: { name: '三角龍', sci: 'Triceratops', diff: 5, fdiff: 5, tip: '離小行星撞擊只剩三個回合！大型草食動物最怕植物停止生長。', plan: 'chordate', habitat: 'land', diet: 'herb', lineage: 'sau',
      t: { size: 8, armor: 7, speed: 3, heat: 6, cold: 3, smart: 2, fert: 4 }, flags: ['spine', 'jaws', 'lungs', 'limbs', 'amnion', 'spikes', 'dino'], hue: 84, look: 'ceratopsian',
      blurb: '頭上有三根角和大頸盾的草食恐龍，敢和暴龍正面對抗。',
      fact: '三角龍一直活到白堊紀的最後，是最後一批非鳥恐龍之一。' },
    mosasaurus: { name: '滄龍', sci: 'Mosasaurus', diff: 4, fdiff: 5, tip: '海洋食物鏈一崩潰，頂級掠食者會最先挨餓。', plan: 'chordate', habitat: 'sea', diet: 'carn', lineage: 'sau',
      t: { size: 9, armor: 3, speed: 6, heat: 5, cold: 3, smart: 3, fert: 3 }, flags: ['spine', 'jaws', 'lungs', 'limbs', 'amnion', 'flippers', 'live'], hue: 214, look: 'mosasaur',
      blurb: '長達十幾公尺的海中巨獸，白堊紀晚期海洋的頂級掠食者。',
      fact: '滄龍不是恐龍，而是回到海裡生活的有鱗類，和今天的巨蜥、蛇比較親近。' },

    eohippus: { name: '始祖馬', sci: 'Eohippus', diff: 1, fdiff: 3, tip: '草原就要擴張了，你的牙齒準備好了嗎？', plan: 'chordate', habitat: 'land', diet: 'herb', lineage: 'syn',
      t: { size: 2, armor: 1, speed: 5, heat: 5, cold: 3, smart: 3, fert: 6 }, flags: ['spine', 'jaws', 'lungs', 'limbs', 'amnion', 'endo', 'fur'], hue: 30, look: 'horse',
      blurb: '只有狐狸大小的早期馬類，在森林裡吃嫩葉，前腳有四根腳趾。',
      fact: '從始祖馬到現代的馬，腳趾從好幾根逐漸減少成一根，是演化史上最完整的化石紀錄之一。' },
    pakicetus: { name: '巴基鯨', sci: 'Pakicetus', diff: 1, fdiff: 3, tip: '陸地還是海洋？你的親戚最後選擇了海洋。', plan: 'chordate', habitat: 'land', diet: 'carn', lineage: 'syn',
      t: { size: 3, armor: 1, speed: 4, heat: 5, cold: 3, smart: 3, fert: 5 }, flags: ['spine', 'jaws', 'lungs', 'limbs', 'amnion', 'endo', 'fur'], hue: 24, look: 'wolf',

      fact: '巴基鯨的耳骨構造和鯨魚一樣特殊，科學家因此確認牠屬於鯨類的祖先家族。' },
    plesiadapis: { name: '更猴', sci: 'Plesiadapis', diff: 1, fdiff: 2, tip: '冰河時期很冷，樹上的生活不會永遠舒適。', plan: 'chordate', habitat: 'land', diet: 'omni', lineage: 'syn',
      t: { size: 1, armor: 0, speed: 4, heat: 5, cold: 3, smart: 4, fert: 6 }, flags: ['spine', 'jaws', 'lungs', 'limbs', 'amnion', 'endo', 'fur'], hue: 18, look: 'squirrel',
      blurb: '像松鼠一樣在樹上生活的小型哺乳類，是靈長類的近親。',
      fact: '更猴的手指末端還是爪子，不像後來的猴子有扁平的指甲。' },

    mammoth: { name: '長毛象', sci: 'Mammuthus', diff: 1, fdiff: 5, tip: '你非常耐寒，但最大的威脅不是寒冷。', plan: 'chordate', habitat: 'land', diet: 'herb', lineage: 'syn',
      t: { size: 8, armor: 3, speed: 3, heat: 1, cold: 7, smart: 5, fert: 2 }, flags: ['spine', 'jaws', 'lungs', 'limbs', 'amnion', 'endo', 'fur', 'graze', 'social', 'fat'], hue: 22, look: 'mammoth',
      blurb: '全身長毛、有巨大彎曲象牙的大象，在冰河時期的草原上成群生活。',
      fact: '最後一批長毛象住在北極的弗蘭格爾島，大約 4000 年前才滅絕，那時埃及的大金字塔已經蓋好了。' },
    smilodon: { name: '劍齒虎', sci: 'Smilodon', diff: 1, fdiff: 4, tip: '大型獵物一旦消失，你也撐不了多久。', plan: 'chordate', habitat: 'land', diet: 'carn', lineage: 'syn',
      t: { size: 5, armor: 2, speed: 5, heat: 4, cold: 4, smart: 4, fert: 4 }, flags: ['spine', 'jaws', 'lungs', 'limbs', 'amnion', 'endo', 'fur', 'social'], hue: 34, look: 'sabercat',
      blurb: '有一對超長犬齒的大貓，擅長伏擊大型獵物。',
      fact: '劍齒虎的嘴巴可以張開到大約 120 度，那對長牙才刺得進獵物。' },
    habilis: { name: '巧人', sci: 'Homo habilis', diff: 1, fdiff: 2, tip: '要在全新世之前發展出語言與文化。', plan: 'chordate', habitat: 'land', diet: 'omni', lineage: 'syn',

      blurb: '早期的人屬成員，會敲打石頭製作簡單的工具。',
      fact: '巧人的腦容量大約只有現代人的一半，但已經會製作石器、吃肉，是人類演化的重要一步。' },

    sinosauropteryx: { name: '中華龍鳥', sci: 'Sinosauropteryx', plan: 'chordate', habitat: 'land', diet: 'carn', lineage: 'sau',

    deinonychus: { name: '恐爪龍', sci: 'Deinonychus', plan: 'chordate', habitat: 'land', diet: 'carn', lineage: 'sau',

    if (!planChange) {

  /* ---------- 隨機投胎 ---------- */
  function rollHTML() {

      '<p class="muted" style="margin:0">如果照地球上真實的生物數量來抽，你幾乎一定會變成細菌。這裡讓每一種生物的機會都一樣。</p></div>' +

      '<div class="btn-row" id="roll-act" hidden><button class="btn btn-primary" data-act="roll-go">就是牠了，開始演化</button><button class="btn" data-act="roll">再抽一次</button></div>';
  }
  function paintRoll(pid, cid, final) {
    var box = document.getElementById('roll-box'); if (!box) return;
    var p = periodOf(pid), c = E.CREATURES[cid];
    box.className = 'roll-box' + (final ? ' landed' : '');
    box.innerHTML = '<span class="roll-era" style="background:' + p.color + ';color:' + inkOn(p.color) + '">' + p.name + '・' + E.fmtAgo(p.start) + '</span>' +
      '<div class="roll-art">' + A.creatureSVG(spOf(cid), { pid: pid, stage: 0, crowd: false }) + '</div>' +
      '<b class="roll-name">' + c.name + '</b>' + (final ? '<p class="roll-blurb">' + c.blurb + '</p>' : '');
    if (final) { var act = document.getElementById('roll-act'); if (act) act.hidden = false; }
  }
  var ALL_PAIRS = [];
  E.START_ERAS.forEach(function (e) { e.creatures.forEach(function (c) { ALL_PAIRS.push([e.pid, c]); }); });
  function startRoll() {
    var pick0 = pickRand(ALL_PAIRS), era = { pid: pick0[0] }, cid = pick0[1];
    S.roll = { pid: era.pid, cid: cid, done: false };
    S.sheet = 'roll'; renderSheet();
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var frames = reduce ? 1 : 15, i = 0, id = S.roll;
    (function step() {

      i++;

    })();
  }

  /* ---------- 遊戲畫面 ---------- */
  // 正在播放時，畫面顯示「這段時間開始時」的狀態；播完才換成下一段

    return { pi: st.pi, stage: st.stage, turn: st.turn, preview: E.previewTurn(st), up: E.upcoming(st), species: speciesOf(st) };
  }
  function clockAt(a, p) { return a.tA + (a.tB - a.tA) * p; }
  var LIVE = { run: '<span class="live"><i></i>時間流逝中</span>', paused: '<span class="live off">已暫停</span>', choose: '<span class="live off">抉擇時刻</span>', tp: '<span class="live warn">轉折點</span>', reflect: '<span class="live off">回顧時刻</span>' };

    var st = S.st, v = view(), last = st.mode === 'future' ? E.PERIODS.length - 1 : E.QUAT;

    var a = S.anim, st = S.st; if (!a || a.tpDone) return;
    stopTpTimer();
    var res = E.chooseTurning(st, optId);
    a.tpDone = true;
    if (!res) { S.phase = 'run'; S.sheet = null; render(); startLoop(); return; }
    var lead = how === 'auto' ? '自動選擇：' : how === 'timeout' ? '來不及決定，牠們本能地選擇了：' : '你的選擇：';
    var okTxt = res.ok === true ? '<span class="okk good">成功</span>' : res.ok === false ? '<span class="okk bad">失敗</span>' : '';
    var sub = rowsText(res);
    pushFeed(E.fmtAgo(clockAt(a, TP_AT)), 'tpres' + (res.ok === false ? ' bad' : res.ok === true ? ' good' : ''),
      lead + '<b>' + esc(res.label) + '</b>' + okTxt + '<p>' + esc(res.text) + '</p>' + (sub ? '<span class="fe-sub">' + sub + '</span>' : ''),
      res.label + (res.ok === true ? '（成功）' : res.ok === false ? '（失敗）' : '') + '：' + res.text);
    sfx(res.ok === false ? 'fail' : 'ok');
    S.tpView = null; S.sheet = null; S.phase = 'run';
    render();
    startLoop();
  }

  /* 回顧時刻 */
  function reflectionFor(st, rec, pre) {
    var R = st.reflects || (st.reflects = {});
    if (rec.event.kind === 'mass' && !R.mass) { R.mass = 1; return { id: 'mass', title: '撐過了' + rec.event.name, q: '牠們剛剛撐過了地球史上最可怕的災難之一。如果牠們聽得懂，你想對牠們說什麼？' }; }
    var g0 = groupOf(pre.pi), g1 = groupOf(st.pi);
    var T = { pal: ['進入古生代', '動物的時代開始了。回頭看看，牠和剛出發時相比，變了多少？'], mes: ['中生代開始了', '恐龍的時代就要來了。你覺得牠準備好了嗎？'],
      cen: ['新生代開始了', '恐龍的時代結束了，世界空了出來。你希望牠接下來變成什麼樣子？'], fut: ['跨進未來', '從這裡開始，是沒有人看過的地球。你想帶牠走向哪裡？'] }[g1];
    if (g0 !== g1 && !R[g1] && T) { R[g1] = 1; return { id: g1, title: T[0], q: T[1] }; }
    var big = st.startTime > 600, mile = big ? 1000 : 100;
    if (E.survivedMa(st) >= mile && !R.span) {
      R.span = 1;
      return big ? { id: 'span', title: '撐過了十億年', q: '如果把十億年壓縮成一天，人類（智人）出現到現在只占最後大約 26 秒；有文字的歷史，連半秒都不到。這十億年裡，你最難忘的是哪一刻？' }
        : { id: 'span', title: '撐過了一億年', q: '如果把一億年壓縮成一天，人類（智人）出現到現在，只占最後大約 4 分鐘；有文字的歷史，只占最後大約 4 秒。這一億年裡，你最難忘的是哪一刻？' };
    }
    if (st.rivals && st.rivals.length && st.rivals.every(function (r) { return !r.alive; }) && !R.alone) { R.alone = 1; return { id: 'alone', title: '只剩下你了', q: '和你同時出發的物種都已經滅絕了。你想對牠們說什麼？' }; }
    if (st.minPop < 12 && st.pop >= 50 && !R.comeback) { R.comeback = 1; return { id: 'comeback', title: '從谷底爬回來了', q: '族群曾經只剩下一點點，差一點就滅絕。這一路上，是什麼讓牠們撐了下來？' }; }
    return null;
  }
  function reflectHTML() {
    var st = S.st, rf = S.reflect, f0 = st.forms[0], cr = E.CREATURES[st.sp.base], nick = esc(st.nick);
    var span = E.fmtSpan(Math.max(0, E.survivedMa(st)));
    var rv = st.rivals || [], alive = rv.filter(function (r) { return r.alive; }).length;
    var real = E.REAL_END[st.sp.base], now = E.stageTime(st.pi, st.stage), realTxt = '';
    if (real === 0 || real == null) realTxt = '真實世界裡，' + cr.name + '這一類生物一直活到了今天。';
    else if (now < real) realTxt = E.LINE_LIVES.indexOf(st.sp.base) !== -1 ? '真實世界裡的' + cr.name + '在' + E.fmtAgo(real) + '消失了，但牠的近親一路演化到了今天。'
      : '真實世界裡，' + cr.name + '在' + E.fmtAgo(real) + '就滅絕了。你的' + nick + '已經比真實的牠多活了 ' + E.fmtSpan(real - now) + '。';
    else realTxt = '真實世界裡，' + cr.name + '會在' + E.fmtAgo(real) + '消失。你的' + nick + '能撐得更久嗎？';
    return '<div class="sheet-head"><span class="meta">時間暫停・回顧時刻</span><h2 id="sheet-h">' + esc(rf.title) + '</h2></div>' +
      '<div class="compare"><figure class="form"><div class="mini">' + A.creatureSVG(f0.sp, { pid: f0.pid, stage: f0.stage, crowd: false }) + '</div><figcaption><b>出發的時候</b><span>' + f0.time + '・' + f0.cls + '</span></figcaption></figure>' +
      '<span class="arrow" aria-hidden="true">→</span>' +
      '<figure class="form"><div class="mini">' + A.creatureSVG(st.sp, { pid: E.PERIODS[st.pi].id, stage: st.stage, crowd: false }) + '</div><figcaption><b>現在</b><span>' + E.fmtAgo(now) + '・' + E.classify(st.sp) + '</span>' +
      (st.species && st.species.fic ? '<span class="fc-sp">' + esc(st.species.zh) + ficTag(true) + '</span>' : '') + '</figcaption></figure></div>' +
      '<ul class="cmp"><li><span>已經撐了</span><b class="num">' + span + '</b></li><li><span>突變</span><b class="num">' + st.mutations + ' 次</b></li>' +
      '<li><span>撐過的大滅絕</span><b class="num">' + st.survivedMass.length + ' 次</b></li>' + (rv.length ? '<li><span>同時出發的物種</span><b class="num">還剩 ' + alive + ' / ' + rv.length + '</b></li>' : '') + '</ul>' +
      '<p class="fact"><b>真實世界</b>' + realTxt + '</p>' +
      '<div class="ask"><label for="note">' + esc(rf.q) + '</label><input id="note" maxlength="40" autocomplete="off" placeholder="寫一句話給' + nick + '（可以不寫）"></div>' +
      '<button class="btn btn-primary" data-act="reflect-done">繼續演化</button>';
  }
  function reflectDone() {
    var st = S.st, rf = S.reflect; if (!rf || !st) return;
    var el = document.getElementById('note'), txt = el ? el.value.trim() : '';
    var when = E.fmtAgo(E.stageTime(st.pi, st.stage));
    if (txt) {
      st.notes = st.notes || [];
      st.notes.push({ time: when, title: rf.title, text: txt });
      pushFeed(when, 'note2', '你在「' + esc(rf.title) + '」的時候留下了一句話：<q>' + esc(txt) + '</q>', '你留下了一句話');
    }
    S.reflect = null; S.sheet = null;
    toChoose();
  }

  function finishTurn() {
    stopLoop();
    var a = S.anim, st = S.st;
    if (a && !a.tpDone) { a.tpDone = true; st.tpCur = null; }
    if (a && !a.resolved) resolveNow();
    if (a) tick(1);
    var rec = a ? a.rec : null, pre = a ? a.pre : null;
    S.anim = null;
    noteDex(false); checkAch(false);
    if (!st.alive || st.won) {
      if (!st.alive) E.finishRivals(st);   // 你滅絕了，其他物種會把剩下的時間走完
      S.phase = 'over'; S.auto = false; recordRun(); checkAch(true);
      render();
      sfx(st.alive ? 'win' : 'extinct');
      later(function () { if (S.phase === 'over' && S.screen === 'game') show('end'); }, 3800);
      return;
    }
    var rf = rec && pre ? reflectionFor(st, rec, pre) : null;
    if (rf) { S.reflect = rf; S.phase = 'reflect'; S.sheet = 'reflect'; render(); sfx('reflect'); return; }
    toChoose();
  }
  function toChoose() {
    S.phase = 'choose';
    if (S.auto) { S.sheet = null; render(); later(autoNext, Math.round(500 / S.speed)); }
    else { S.sheet = 'decide'; render(); }
  }
  function autoNext() {
    var st = S.st;
    if (!S.auto || S.phase !== 'choose' || !st || !st.alive || st.won) return;
    var danger = E.upcoming(st).filter(function (u) { return u.inTurns === 0 && (u.kind === 'mass' || u.kind === 'final'); })[0];
    if (danger && S.autoPausedTurn !== st.turn) {
      S.autoPausedTurn = st.turn; S.auto = false;
      S.sheet = 'decide'; render();
      toast('「' + danger.name + '」就要來了，自動選擇先暫停，這一步請你親自決定。');
      return;
    }
    startTurn(E.autoPick(st));
  }
  function pauseToggle() {
    if (S.phase === 'run') { S.phase = 'paused'; stopLoop(); }
    else if (S.phase === 'paused') { S.phase = 'run'; startLoop(); }
    else return;
    renderTopbar(); renderControls(); soundScene();
    var fh = document.querySelector('.feed-head .live'); if (fh) fh.style.visibility = S.phase === 'run' ? '' : 'hidden';
  }

  function renderGame() {
    var st = S.st, v = view();
    renderTopbar();
    app.className = 'wrap wide';
    app.innerHTML = '<div class="game">' +
      '<div class="g-spec">' + specimenCard(st, v) + '</div>' +
      '<div class="g-vitals">' + vitals(st) + '</div>' +
      '<div class="g-focus">' + focusCard() + '</div>' +
      '<div class="g-feed">' + feedPanel() + '</div>' +
      '<div class="g-rivals">' + rivalsCard() + '</div>' +
      '<div class="g-fc">' + forecast(v.up) + '</div>' +
      '<div class="g-env">' + envBlock(st, v) + '</div>' +
      '<div class="g-traits">' + traitsPanel(st.sp) + '</div></div>';
    if (S.anim) tick(Math.min(1, S.anim.elapsed / BASE_MS));
    renderControls();
  }
  function renderControls() {
    if (S.screen !== 'game') return;
    var ph = S.phase, main;
    if (ph === 'choose') main = '<button class="btn btn-primary ctl-main" data-act="decide">做出選擇</button>';
    else if (ph === 'tp') main = '<button class="btn btn-primary ctl-main" data-act="opentp">面對轉折點</button>';
    else if (ph === 'reflect') main = '<button class="btn btn-primary ctl-main" data-act="openreflect">回顧時刻</button>';
    else if (ph === 'run') main = '<button class="btn ctl-main" data-act="pause">' + ICON_PAUSE + '暫停</button>';
    else if (ph === 'paused') main = '<button class="btn btn-primary ctl-main" data-act="pause">' + ICON_PLAY + '繼續</button>';
    else main = '<button class="btn btn-primary ctl-main" data-act="toend">看結局</button>';
    var i = SPEEDS.indexOf(S.speed);
    var speed = '<div class="speed" role="group" aria-label="時間速度">' +
      '<button class="sp-btn" data-act="slower"' + (i <= 0 ? ' disabled' : '') + ' aria-label="放慢時間">慢</button>' +
      '<span class="sp-val num" aria-live="polite">' + speedLabel(S.speed) + '</span>' +
      '<button class="sp-btn" data-act="faster"' + (i >= SPEEDS.length - 1 ? ' disabled' : '') + ' aria-label="加快時間">快</button></div>';
    var auto = '<label class="auto" title="讓遊戲幫你選突變、重心和轉折點，遇到大滅絕會停下來"><input type="checkbox" id="auto"' + (S.auto ? ' checked' : '') + (ph === 'over' ? ' disabled' : '') + '><span>自動選擇</span></label>';
    actionbar.hidden = false;
    actionbar.innerHTML = '<div class="ab-in wide">' + main + speed + auto + '</div>';
  }
  function setSpeed(dir) {
    var i = SPEEDS.indexOf(S.speed) + dir;
    if (i < 0 || i >= SPEEDS.length) return;
    S.speed = SPEEDS[i]; save(KEY_SPEED, S.speed);
    renderControls(); sfx('click');
  }

  /* ---------- 抉擇時刻 ---------- */
  function decideHTML() {
    var st = S.st, p = E.PERIODS[st.pi], v = view();
    var views = st.options.map(function (id) { return E.mutationView(st.sp, E.MUT_INDEX[id]); });
    var boost = st.options.length > E.optionCount(st.div) ? '<p class="note">輻射讓突變變多了：這次多了一個選項。</p>' : '';
    var skip = '<label class="opt is-skip" style="--i:' + views.length + '">' +
      '<input type="radio" name="mut" value="skip" id="mut-skip">' +
      '<span class="opt-top"><span class="opt-cat">不突變</span><span class="opt-check" aria-hidden="true"></span></span>' +
      '<span class="opt-name">保持原樣</span><span class="chips"><span class="chip chip-up">遺傳多樣性不會下降</span></span>' +
      '<span class="opt-desc">不讓任何新突變擴散，族群裡各式各樣的基因保留得比較多。</span></label>';
    return '<div class="sheet-head"><span class="meta num">時間暫停・' + p.name + '・' + E.stageName(p, st.stage) + '・' + E.fmtAgo(E.stageTime(st.pi, st.stage)) + '</span>' +
      '<h2 id="sheet-h">抉擇時刻</h2><p class="muted" style="margin:0">族群裡出現了幾種新的突變。選一個讓它擴散，時間就會繼續前進。</p></div>' +
      forecast(v.up) + envCompact(st, v) +
      '<div class="sheet-focus"><h3>這段時間的族群重心</h3>' + focusOptions(true) + '</div>' + boost +
      '<div class="opts" role="radiogroup" aria-labelledby="sheet-h">' + views.map(optionCard).join('') + skip + '</div>' +
      '<button class="link" data-act="peek">先看看牠的狀況</button>';
  }

  function tpHTML() {
    var v = S.tpView;
    var timer = v.timed ? '<div class="tp-timer" aria-hidden="true"><i id="tp-bar" style="transform:scaleX(' + (S.tpLeft / TP_MS).toFixed(3) + ')"></i></div><p class="tp-left num" id="tp-left" aria-live="off">還剩 ' + Math.ceil(S.tpLeft / 1000) + ' 秒</p>' : '';
    return '<div class="sheet-head"><span class="meta">時間暫停・轉折點</span><span class="kind tpk' + (v.timed ? ' hot' : '') + '">' + v.cat + '</span>' +
      '<h2 id="sheet-h">' + esc(v.title) + '</h2><p class="muted" style="margin:0">' + v.text + '</p></div>' + timer +
      '<div class="opts" role="radiogroup" aria-labelledby="sheet-h">' + v.options.map(function (o, i) {
        return '<label class="opt tp-opt" style="--i:' + i + '"><input type="radio" name="tp" value="' + o.id + '">' +
          '<span class="opt-top"><span class="opt-cat">' + esc(o.hint || '') + '</span>' +
          (o.odds ? '<span class="odds odds-' + o.odds + ' num">' + ODDS[o.odds] + '・約 ' + Math.round(o.p * 100) + '%</span>' : '<span class="opt-check" aria-hidden="true"></span>') + '</span>' +
          '<span class="opt-name">' + esc(o.label) + '</span><span class="opt-desc">' + esc(o.desc) + '</span></label>';
      }).join('') + '</div>' +
      (v.fact ? '<p class="fact"><b>真實世界</b>' + v.fact + '</p>' : '');
  }

  // 決定一隻生物畫出來長什麼樣子的欄位（和 Art.creatureSVG 用到的一樣）：相同就代表圖一樣
  function lookKey(sp) { return JSON.stringify([sp.plan, sp.habitat, sp.diet, sp.look, sp.lineage, sp.hue, sp.t, sp.flags]); }
  function rivalHTML() {
    var st = S.st, list = rivalsData(), r = list[S.rivalOpen], rs = st.rivals && st.rivals[S.rivalOpen];
    if (!r || !rs) return '';
    var cr = E.CREATURES[rs.sp.base], v = view();
    var rel = r.alive ? E.relOf(st.sp, r.sp) : null;
    var relTxt = { pred: '牠會捕食你的族群，是你的天敵。', prey: '你的族群會捕食牠們。', comp: '牠們吃的東西和你差不多，會和你搶食物。' }[rel] || (r.alive ? '目前和你的族群沒有直接的關係。' : '');
    var status = r.alive ? (r.won ? ENDING[r.ending] : '族群 ' + Math.round(r.pop) + '・' + E.popCount(r.sp, r.pop)) : '滅絕・' + rivWhen(r);
    var maxTurn = S.anim && !S.anim.rivShown ? S.anim.pre.turn - 1 : 1e9;
    var forms = (rs.forms || []).filter(function (f) { return f.turn <= maxTurn; });
    // 縮圖的最後一張要和上面的大圖一樣：之後又改變過，就補上牠現在（或滅絕時）的樣子
    var lastF = forms[forms.length - 1];
    if (lastF && lookKey(lastF.sp) !== lookKey(r.sp)) {
      forms.push(r.alive && !r.won ? { cls: '現在的樣子', time: E.fmtAgo(E.stageTime(v.pi, v.stage)), sp: r.sp, pid: E.PERIODS[v.pi].id, stage: v.stage }
        : { cls: '最後的樣子', time: rivWhen(r), sp: r.sp, pid: E.PERIODS[r.pi].id, stage: r.stage });
    }
    var strip = forms.map(function (f, i) {
      return (i ? '<span class="arrow" aria-hidden="true">→</span>' : '') + '<figure class="form"><div class="mini">' + A.creatureSVG(f.sp, { pid: f.pid, stage: f.stage, crowd: false }) + '</div><figcaption><b>' + f.cls + '</b><span>' + f.time + '</span></figcaption></figure>';
    }).join('');
    var spLine = r.species && r.species.fic ? speciesHTML(r.species, true) + '<p class="muted" style="margin:0">' + r.cls + '・原本是' + cr.name + '（<i>' + esc(cr.sci) + '</i>）</p>'
      : '<p class="muted" style="margin:0"><i>' + esc(cr.sci) + '</i>・' + r.cls + '</p>';
    return '<div class="sheet-head"><span class="meta">同時出發的物種</span><h2 id="sheet-h">' + esc(r.name) + '</h2>' + spLine + '</div>' +
      '<div class="card rv-big' + (r.alive ? '' : ' dead') + '"><div class="art">' + A.creatureSVG(r.sp, { pid: r.alive ? E.PERIODS[v.pi].id : E.PERIODS[r.pi].id, stage: r.alive ? v.stage : r.stage, fossil: !r.alive, label: esc(r.name) }) + '</div></div>' +
      '<p class="rv-status"><b>' + status + '</b>' + (!r.alive && r.cause ? '<span class="muted">' + esc(r.cause) + '</span>' : '') + '</p>' +
      (relTxt ? '<p>' + (rel ? '<span class="rel rel-' + rel + '">' + REL[rel] + '</span>' : '') + relTxt + '</p>' : '') +
      '<p class="muted">' + cr.blurb + '</p>' +
      (forms.length > 1 ? '<section class="journey"><h3>牠的演化之路</h3><div class="strip">' + strip + '</div></section>' : '') +
      (rs.survivedMass.length ? '<div class="badges">' + rs.survivedMass.map(function (n) { return '<span class="badge">撐過' + esc(n) + '</span>'; }).join('') + '</div>' : '') +
      '<p class="fact"><b>真實世界</b>' + cr.fact + '</p>' +
      '<button class="btn" data-act="closesheet">關閉</button>';
  }

  /* ---------- 說明 ---------- */
  function helpHTML() {
    return '<div class="help"><div class="sheet-head"><span class="meta">怎麼玩</span><h2 id="sheet-h">演化之路的規則</h2></div>' +
      '<h3>目標</h3><p>從 ' + E.START_ERAS.length + ' 個時代、' + ALL_REAL.length + ' 種真實的古生物裡選一個起點，讓牠的族群一路撐下去。族群歸零就滅絕；經典模式撐到現代就過關，未來模式則要在 10 億年內統治地球（或搭太空船離開）。</p>' +
      '<h3>時間會自己流逝</h3><ol><li>每到「抉擇時刻」，時間會停下來，讓你從隨機出現的突變裡選一個，或選「保持原樣」。</li>' +
      '<li>時間走到一半，可能遇到「轉折點」：遷徙、疾病、求偶、搶地盤……天敵來襲時還要限時決定。</li>' +
      '<li>撐過大滅絕或跨進新的年代時，會有「回顧時刻」，可以比較牠和剛出發時的樣子，留一句話給牠。</li>' +
      '<li>畫面下方可以暫停、放慢或加快時間。開啟「自動選擇」會讓遊戲幫你決定，遇到大滅絕前會停下來讓你親自決定。</li></ol>' +
      '<h3>族群重心</h3><p>隨時可以在「覓食、繁殖、擴張、躲藏」之間切換。平常多繁殖，食物不夠就覓食，大滅絕前躲藏或擴張，常常能救命。選項上的數字是對成長力的影響，「建議」是遊戲算出來的參考。</p>' +
